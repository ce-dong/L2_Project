[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l2-project"
version = "0.1.0"
description = "Low-memory A-share Level-2 microstructure pipeline built on Polars."
requires-python = ">=3.10"
dependencies = [
    "polars>=1.14.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
